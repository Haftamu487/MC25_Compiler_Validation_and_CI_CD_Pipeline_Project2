name: MC-25 Compiler CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison gcc libfl-dev default-jre

      - name: Run compiler tests
        run: make test

      - name: Run validation
        run: ./validate.sh